<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Bagian 19 - Event Handling</title>
</head>

<body>
    <h1>Product Explorer</h1>
    <input
        type="text"
        id="search-input"
        placeholder="Cari produk..."
    >

    <select id="category-select">
        <option value="all">
            Semua Kategori
        </option>
        <option value="laptops">
            Laptops
        </option>
        <option value="smartphones">
            Smartphones
        </option>
    </select>

    <select id="sort-select">
        <option value="default">
            Default
        </option>
        <option value="price-asc">
            Harga Termurah
        </option>
        <option value="price-desc">
            Harga Termahal
        </option>
        <option value="title">
            Nama
        </option>
    </select>

    <div id="product-list"></div>

    <script src="bagian19.js"></script>
    
</body>
</html>
