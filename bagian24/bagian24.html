<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bagian 24 - Fetch API</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }
        h1 {
            margin-bottom: 10px;
        }
        #status {
            margin-bottom: 20px;
            font-weight: bold;
        }
        #product-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
        }
        .product-card h3 {
            margin-bottom: 8px;
        }
        .price {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Product Explorer</h1>

    <div id="status">
        Menunggu proses...
    </div>

    <div id="product-list"></div>

    <script type="module" src="bagian24.js"></script>

</body>

</html>
